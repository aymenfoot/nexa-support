name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t nexa-support .
      - name: Run container
        run: docker run -d --name copilot -p 8000:8000 nexa-support
      - name: Hit health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs copilot
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f copilot
